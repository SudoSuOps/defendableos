version: "3.9"

# DefendableOS local development stack.
# Brings up Postgres + Redis + MinIO. The API and worker can be run either
# from this compose file (uncomment below) or from the host with the venv.

services:
  postgres:
    image: postgres:16
    container_name: defendable-postgres
    environment:
      POSTGRES_USER: defendable
      POSTGRES_PASSWORD: defendable
      POSTGRES_DB: defendableos
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defendable -d defendableos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: defendable-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: defendable-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Bootstraps the private + public buckets on first boot.
  minio-bootstrap:
    image: minio/mc:latest
    container_name: defendable-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/defendable-private &&
      mc mb --ignore-existing local/defendable-public &&
      mc anonymous set download local/defendable-public &&
      echo 'buckets ready' &&
      exit 0
      "

