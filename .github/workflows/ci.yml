name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep this workflow minimal: it MUST run the same gates we run locally.
# No deployment yet. The deploy workflow is a deliberate separate step.

jobs:
  backend:
    name: backend · pytest + ruff
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: defendable
          POSTGRES_PASSWORD: defendable
          POSTGRES_DB: defendableos
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U defendable -d defendableos"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://defendable:defendable@localhost:5432/defendableos
      APP_ENV: test
      ENS_MODE: mock
      ENS_LIVE_WRITES_ENABLED: "false"
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check app/
      - name: Alembic migrations (smoke)
        run: alembic upgrade head
      - name: Pytest
        run: pytest app/tests -v

  frontend:
    name: frontend · next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: production build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_APP_NAME: DefendableOS
          NEXT_PUBLIC_ENS_PARENT_NAME: defendable.eth
        run: npm run build

  edge-agent:
    name: edge-agent · install + help
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/edge-agent
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: defendable-box --help (smoke)
        run: defendable-box --help
