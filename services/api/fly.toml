# fly.toml app configuration file generated for defendableos-api on 2026-05-22T15:26:05-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'defendableos-api'
primary_region = 'iad'
kill_signal = 'SIGINT'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  API_BASE_URL = 'https://api.defendableos.com'
  APP_ENV = 'production'
  APP_NAME = 'DefendableOS'
  ENS_LIVE_WRITES_ENABLED = 'false'
  ENS_MODE = 'mock'
  ENS_PARENT_NAME = 'defendable.eth'
  SEED_DEMO_DATA = 'true'
  UVICORN_WORKERS = '2'
  WEB_BASE_URL = 'https://defendableos.com'
  # Model gateway · sovereign in-house provider when SwarmCurator is reachable on tailnet.
  # Flip MODEL_PROVIDER=swarmcurator AFTER tailscale sidecar is verified reaching smash:8088.
  # Keep "kimi" default until Phase 3 of the rollout · then update this line.
  MODEL_PROVIDER = 'kimi'
  SWARMCURATOR_BASE_URL = ''        # set via `fly secrets set` once tailnet reach is verified (e.g. http://smash:8088/v1)
  SWARMCURATOR_MODEL = 'swarmcurator-9b'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
