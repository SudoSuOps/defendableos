[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defendable-box"
version = "0.1.0"
description = "Defendable Box · DefendableOS edge appliance CLI"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "jsonschema>=4.19",
]

[project.scripts]
defendable-box = "defendable_box.cli:app"
defendable-compute = "defendable_box.compute_cli:app"
defendable-agentgrade = "defendable_box.agentgrade_cli:app"

[tool.setuptools.packages.find]
include = ["defendable_box*"]
